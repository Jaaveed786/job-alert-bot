name: Post jobs
on:
  schedule:
    - cron: "0 * * * *"   # runs automatically every hour (24/7)
  workflow_dispatch: {}      # lets you run it manually
permissions:
  contents: write
concurrency:
  group: post-jobs
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python job_bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: "@indiajobupdates_official"
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      - name: Save posted-jobs list
        run: |
          git config user.name "jobbot"
          git config user.email "jobbot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen" && git push)
